
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Little Universe 💗</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Georgia, "Times New Roman", serif;
  color: #702f49;
  background: linear-gradient(135deg, #fff0f4, #fbe1ea, #fff7f9);
  overflow-x: hidden;
}

.page {
  min-height: 100vh;
  padding: 35px 18px 55px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

h1 {
  font-size: clamp(28px, 5vw, 44px);
  margin: 0 0 12px;
}

.subtitle {
  margin: 0 0 30px;
  font-size: 16px;
  line-height: 1.7;
}

.universe {
  width: 100%;
  max-width: 1050px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(210px, 1.25fr) minmax(0, 1fr);
  align-items: center;
  gap: 24px;
}

.side-photo {
  display: block;
  width: 100%;
  max-width: 250px;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  justify-self: center;
  border: 5px solid white;
  border-radius: 18px;
  box-shadow: 0 8px 25px #b45d7b30;
}

.stars {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  width: 100%;
}

.star-button {
  min-height: 105px;
  border: 1px solid #efb6cb;
  border-radius: 18px;
  background: #fff9fb;
  color: #a34568;
  font: inherit;
  font-size: 16px;
  cursor: pointer;
  padding: 14px 8px;
  box-shadow: 0 5px 14px #a3456815;
  transition: transform .2s, background .2s;
}

.star-button:hover {
  transform: translateY(-4px);
  background: #ffe4ed;
}

.star-symbol {
  display: block;
  font-size: 30px;
  margin-bottom: 8px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  padding: 20px;
  background: #4a1934a8;
  align-items: center;
  justify-content: center;
}

.modal.show { display: flex; }

.modal-card {
  position: relative;
  width: min(100%, 560px);
  max-height: 85vh;
  overflow-y: auto;
  background: #fff8fb;
  padding: 35px 25px;
  border-radius: 22px;
  box-shadow: 0 15px 55px #39102340;
  animation: appear .3s ease;
}

.modal-card h2 {
  margin-top: 0;
  font-size: 25px;
}

.modal-card p {
  font-size: 17px;
  line-height: 1.9;
  white-space: pre-wrap;
}

.close-button {
  position: absolute;
  top: 10px;
  right: 15px;
  border: 0;
  background: transparent;
  color: #a34568;
  font-size: 28px;
  cursor: pointer;
}

.floating-heart {
  position: fixed;
  z-index: 2000;
  pointer-events: none;
  animation: heartFloat 1.8s ease-out forwards;
  font-size: 23px;
}

.confetti {
  position: fixed;
  top: -35px;
  z-index: 3000;
  pointer-events: none;
  animation: confettiFall 3.5s ease-in forwards;
  font-size: 23px;
}

@keyframes heartFloat {
  0% { opacity: 1; transform: translateY(0) scale(.7) rotate(0deg); }
  100% { opacity: 0; transform: translateY(-170px) scale(1.5) rotate(25deg); }
}

@keyframes confettiFall {
  0% { opacity: 1; transform: translateY(0) rotate(0deg); }
  100% { opacity: 0; transform: translateY(110vh) rotate(720deg); }
}

@keyframes appear {
  from { opacity: 0; transform: scale(.92); }
  to { opacity: 1; transform: scale(1); }
}

@media (max-width: 650px) {
  .page { padding: 30px 14px; }
  .universe {
    grid-template-columns: 1fr 1fr;
    gap: 15px;
  }
  .side-photo {
    width: 100%;
    max-width: 190px;
    aspect-ratio: 4 / 5;
  }
  .stars {
    grid-column: 1 / -1;
    grid-row: 2;
    max-width: 400px;
    justify-self: center;
  }
  .star-button { min-height: 90px; }
  .modal-card { padding: 32px 20px 22px; }
}
</style>
</head>

<body>
<main class="page">
  <h1>Our Little Universe ✨</h1>
  <p class="subtitle">
    dört küçük yıldız, kocaman bir aşk.<br>
    Her birine dokun bakalım, sevgilim 💗
  </p>

  <section class="universe" aria-label="Anılarımız">
    <img class="side-photo" src="./kirmizi.jpeg"
         alt="Kırmızı fotoğrafımız">

    <div class="stars">
      <button class="star-button" onclick="openMemory(0)">
        <span class="star-symbol">✦</span>İlk yıldız
      </button>
      <button class="star-button" onclick="openMemory(1)">
        <span class="star-symbol">✧</span>İkinci yıldız
      </button>
      <button class="star-button" onclick="openMemory(2)">
        <span class="star-symbol">✧</span>Üçüncü yıldız
      </button>
      <button class="star-button" onclick="openMemory(3)">
        <span class="star-symbol">✦</span>Son yıldız 💗
      </button>
    </div>

    <img class="side-photo" src="./siyah.jpeg"
         alt="Siyah fotoğrafımız">
  </section>
</main>

<div class="modal" id="memoryModal" onclick="closeOutside(event)">
  <article class="modal-card">
    <button class="close-button" onclick="closeMemory()" aria-label="Kapat">×</button>
    <h2 id="memoryTitle"></h2>
    <p id="memoryText"></p>
  </article>
</div>

<script>
const memories = [
  [
    "hic unutmak istemediğim bir anımız <33 ",
    "bunun cevabı kesinlikle tanistigimiz gece olurdu..seni, sacin basin daginik ve uyku mahmuru gördügüm ilk o an..hayatımda gördügüm en güzel seydin..porsuk kıyısında otururken kacamak bakislarla seni izliyordum.hava öyle güzel ve romantikti ki.sakalasmalarimiz, utangac flortlesmelerimiz...sana vurulduguma emindim, simdi uzagindayken bile yagmur damlaları o gecedeki gibi dokunuyor tenime her seferinde, sevgin beni sardıkca."
  ],
  [
    "sevgilimin en sevdigim özellikleri",
    "buraya sıgması ve benim balık hafızamla hepsini yazmamın mumkun olmadigi olay. ama denicem askim. ilk once ellerine, isil isil gözlerine vurulmustum seni ilk tanigimda..gözlerin öyle canliydi ki baktikca her seyden soyutlanıyordum. kokun bebek gibi, öyle zarif ve asilsin ki sana bakmaktan kendimi alamıyorum. tum bunlarin yaninda!! sevildigimi, degerli oldugumu oyle guzel hissediyorum ki seninle. boyle guzel bir kadini sevmenin yaninda bi de o da beni seviyo NE!?!?!! ayrıca dürüstlügünü, inceligini, nahif kalbini, sevdigin seyleri coskuyla tadisini, omurgali durusunu, fikirlerini seni sen yapan her detayi cok seviyorum. sevgilim = powerpuff girls'te dunyanin en guzel herrr seyi eklenerek yaratilmis benim minik buttercup'im <333 "
  ],
  [
    "bizim en büyük sırrımız",
    "bizde ogrenilen herr dedikodu ve herrr olay aninda esimize anlatildigi icin sirrimiz yoktur ve bizim en derin sirlarimiz sadece birbirimizdedir. ama vermemizin mumkun olmadigi bir sir var!! nasil böyle asik oldugumuz..maalesef cocuklar siz de esimle benim gibi perfect matchinizi bulamadiginiz sürece anlamaniz mumkun degil..bu kadin hayali cicek verdi first dateimizde direkt aldim yahu!!"
  ],
  [
    "cerez tabaginda kalan son fistigim <333 buraya da tikla bakalim!!",
    "iyi ki doğdun sevgilim. hayatımda olduğun için öyle mutluyum ki. bu seferlik yaninda olamasam da en yakin zamanda kendi evimizde kutlayacagimizi biliyorum. gec olsun gerekirse guc de olsun ama senle olsun canimin ici. gözlerimi doldu kacmam gerek simdi. sana cok asigim. iyi ki benimsin. nice mutlu yaslara sevgilim :') ♡"
  ]
];

function showHearts() {
  const symbols = ["💗", "💕", "💖", "♡", "✨"];

  for (let i = 0; i < 18; i++) {
    const heart = document.createElement("span");
    heart.className = "floating-heart";
    heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.top = (45 + Math.random() * 45) + "vh";
    heart.style.animationDelay = Math.random() * 0.35 + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 2300);
  }
}

function birthdaySurprise() {
  const symbols = ["💖", "💗", "🎂", "✨", "💕", "🎉", "💝"];

  for (let i = 0; i < 65; i++) {
    const piece = document.createElement("span");
    piece.className = "confetti";
    piece.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    piece.style.left = Math.random() * 100 + "vw";
    piece.style.animationDelay = Math.random() * 1.8 + "s";
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 6000);
  }
}

function openMemory(index) {
  showHearts();

  document.getElementById("memoryTitle").textContent = memories[index][0];
  document.getElementById("memoryText").textContent = memories[index][1];
  document.getElementById("memoryModal").classList.add("show");

  if (index === 3) {
    birthdaySurprise();
  }
}

function closeMemory() {
  document.getElementById("memoryModal").classList.remove("show");
}

function closeOutside(event) {
  if (event.target.id === "memoryModal") {
    closeMemory();
  }
}

document.addEventListener("keydown", function(event) {
  if (event.key === "Escape") closeMemory();
});
</script>
</body>
</html>
